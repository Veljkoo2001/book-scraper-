# docker-compose.yml u korenu
version: '3.8'

services:
  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: advanced_scraper
    volumes:
      # Mountuj foldere da sačuvaš podatke između pokretanja
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - HEADLESS=true
      - MAX_PAGES=5
      - DB_PATH=/app/data/database/books.db
    # Možeš da pokreneš različite komande
    command: python main.py
    # Ili za testiranje:
    # command: python -m pytest tests/

  # Dodatni servis za admin UI (opcionalno)
  admin:
    image: phpmyadmin/phpmyadmin
    container_name: scraper_admin
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=scraper
    depends_on:
      - scraper